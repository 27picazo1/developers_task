<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guardar en Recursos</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>Guardar en Recursos</h1>

    <label for="text">Enlaces y texto <small>(la primera línea de texto es el título)</small></label>
    <textarea id="text" rows="6" spellcheck="false" placeholder="Pega aquí enlaces o texto…"></textarea>

    <label id="drop" for="file">
      <span>Arrastra imágenes aquí, pégalas con <kbd>Ctrl</kbd>+<kbd>V</kbd> o haz clic<br><small>Se suben a Imgur · hasta 8 imágenes, 8 MB cada una</small></span>
      <input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple hidden>
    </label>
    <div id="thumbs" aria-live="polite"></div>

    <div class="row">
      <div>
        <label for="type">Tipo</label>
        <select id="type">
          <option value="">Automático</option>
          <option value="script">Script</option>
          <option value="mlo">MLO</option>
          <option value="vehicle">Vehículo</option>
          <option value="map">Mapa</option>
          <option value="ui">UI</option>
          <option value="tool">Herramienta</option>
          <option value="other">Otro</option>
        </select>
      </div>
      <div>
        <label for="priority">Prioridad</label>
        <select id="priority">
          <option value="low">Baja</option>
          <option value="medium" selected>Media</option>
          <option value="high">Alta</option>
        </select>
      </div>
    </div>

    <p id="status" role="status"></p>

    <footer>
      <button id="open-web" type="button" class="link" hidden>Abrir la web</button>
      <span class="hint">Ctrl+Enter para enviar</span>
      <button id="cancel" type="button" class="secondary">Cancelar</button>
      <button id="send" type="button" class="primary">Enviar</button>
    </footer>
  </main>
  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
