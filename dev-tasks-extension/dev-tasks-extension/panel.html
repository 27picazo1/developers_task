<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guardar en Recursos</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <p id="locked" hidden></p>
  <div id="app" hidden>
    <header class="head">
      <img src="icons/icon32.png" alt="" width="28" height="28">
      <div class="titles">
        <strong>Dev Tasks · Recursos</strong>
        <span id="chip" class="chip">Nuevo recurso</span>
      </div>
      <button id="close" type="button" class="icon-btn" aria-label="Cerrar" title="Cerrar (Esc)">✕</button>
    </header>

    <main>
      <div class="field">
        <label for="title">Título</label>
        <input id="title" type="text" autocomplete="off" placeholder="Nombre del recurso">
      </div>

      <div class="field">
        <label for="reference">Enlace de referencia <small>(la página completa)</small></label>
        <input id="reference" type="text" autocomplete="off" spellcheck="false" placeholder="https://…">
      </div>

      <div class="row">
        <div class="field">
          <label for="type">Tipo</label>
          <select id="type">
            <option value="">Automático</option>
            <option value="script">Script</option>
            <option value="mlo">MLO</option>
            <option value="vehicle">Vehículo</option>
            <option value="map">Mapa</option>
            <option value="ui">UI</option>
            <option value="tool">Herramienta</option>
            <option value="other">Otro</option>
          </select>
        </div>
        <div class="field">
          <label for="priority">Prioridad</label>
          <select id="priority">
            <option value="low">Baja</option>
            <option value="medium" selected>Media</option>
            <option value="high">Alta</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="downloads">Descargas <small>(un enlace por línea)</small></label>
        <textarea id="downloads" rows="2" spellcheck="false" placeholder="https://…&#10;https://…"></textarea>
      </div>

      <div class="field">
        <label for="description">Descripción</label>
        <textarea id="description" rows="2" placeholder="Qué contiene y para qué sirve…"></textarea>
      </div>

      <div class="field">
        <label for="file">Imágenes</label>
        <label id="drop" for="file">
          <span>Arrastra imágenes aquí, pégalas con <kbd>Ctrl</kbd>+<kbd>V</kbd> o haz clic<br><small>Hasta 8 imágenes · 8 MB cada una · se suben solas</small></span>
          <input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple hidden>
        </label>
        <div id="thumbs" aria-live="polite"></div>
        <p id="hidden-note" class="note" hidden></p>
      </div>
    </main>

    <footer>
      <p id="status" role="status"></p>
      <div class="buttons">
        <button id="open-web" type="button" class="link" hidden>Abrir la web</button>
        <button id="send" type="button" class="primary">Enviar</button>
      </div>
    </footer>
  </div>
  <script src="config.js"></script>
  <script src="panel.js"></script>
</body>
</html>
